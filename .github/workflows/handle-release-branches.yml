name: Handle Release Branches

on:
  push:

permissions: {}

jobs:
  branch-checks:
    if: github.repository_owner == 'storybookjs'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: get-branch
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH="${REF#refs/heads/}"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
    outputs:
      branch: ${{ env.branch }}
      is-latest-branch: ${{ env.branch == 'main' }}
      is-next-branch: ${{ env.branch == 'next' }}
      is-release-branch: ${{ startsWith(env.branch, 'release-') }}
      is-actionable-branch: ${{ env.branch == 'main' || env.branch == 'next' || startsWith(env.branch, 'release-') }}

  handle-latest:
    needs: branch-checks
    if: ${{ needs.branch-checks.outputs.is-latest-branch == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - run: curl -X POST "https://api.netlify.com/build_hooks/${{ secrets.FRONTPAGE_HOOK }}"

  get-next-release-branch:
    needs: branch-checks
    if: ${{ needs.branch-checks.outputs.is-next-branch == 'true' || needs.branch-checks.outputs.is-release-branch == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: next
          path: next
          persist-credentials: false

      # TODO(security): replace with inline `jq -r .version` to drop the `@release` floating tag.
      - id: next-version
        uses: notiz-dev/github-action-json-property@release # zizmor: ignore[unpinned-uses]
        with:
          path: ${{ github.workspace }}/next/code/package.json
          prop_path: version

      - env:
          NEXT_VERSION: ${{ steps.next-version.outputs.prop }}
        run: |
          NEXT_RELEASE_BRANCH=$(echo "$NEXT_VERSION" | sed -E 's/([0-9]+)\.([0-9]+).*/release-\1-\2/')
          echo "next-release-branch=$NEXT_RELEASE_BRANCH" >> "$GITHUB_ENV"
    outputs:
      branch: ${{ env.next-release-branch }}

  create-next-release-branch:
    needs: [branch-checks, get-next-release-branch]
    if: ${{ needs.branch-checks.outputs.is-next-branch == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with creds for later git push)
        # zizmor: ignore[artipacked]  # git push origin requires persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - env:
          TARGET_BRANCH: ${{ needs.get-next-release-branch.outputs.branch }}
          SOURCE_BRANCH: ${{ needs.branch-checks.outputs.branch }}
        run: |
          set +e
          REMOTE_BRANCH=$(git branch -r | grep "origin/${TARGET_BRANCH}")
          if [[ -n "$REMOTE_BRANCH" ]]; then git push origin --delete "$TARGET_BRANCH"; fi
          echo "Pushing branch ${TARGET_BRANCH}..."
          git push -f origin "${SOURCE_BRANCH}:${TARGET_BRANCH}"
    outputs:
      branch: ${{ needs.get-next-release-branch.outputs.branch }}

  next-release-branch-check:
    if: ${{ always() && github.repository_owner == 'storybookjs' }}
    needs: [branch-checks, get-next-release-branch]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          IS_NEXT_RELEASE_BRANCH=${{ needs.branch-checks.outputs.branch == needs.get-next-release-branch.outputs.branch }}
          echo "is-next-release-branch=$IS_NEXT_RELEASE_BRANCH" >> $GITHUB_ENV

      - if: ${{ env.is-next-release-branch == 'true' }}
        run: echo "relevant-base-branch=next" >> $GITHUB_ENV

      - if: ${{ env.is-next-release-branch == 'true' }}
        env:
          BRANCH: ${{ needs.branch-checks.outputs.branch }}
          BASE: ${{ env.relevant-base-branch }}
        run: |
          echo "WARNING: Do not push directly to the \`${BRANCH}\` branch. This branch is created and force-pushed over after pushing to the \`${BASE}\` branch and the changes you just pushed will be lost."
          exit 1
    outputs:
      check: ${{ env.is-next-release-branch }}

  request-create-frontpage-branch:
    if: ${{ always() && github.repository_owner == 'storybookjs' }}
    needs:
      [branch-checks, next-release-branch-check, create-next-release-branch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: ${{ needs.branch-checks.outputs.is-actionable-branch == 'true' && needs.branch-checks.outputs.is-latest-branch == 'false' && needs.next-release-branch-check.outputs.check == 'false' }}
        env:
          BRANCH: ${{ needs.create-next-release-branch.outputs.branch || needs.branch-checks.outputs.branch }}
          FRONTPAGE_TOKEN: ${{ secrets.FRONTPAGE_ACCESS_TOKEN }}
        run: |
          curl -X POST https://api.github.com/repos/storybookjs/frontpage/dispatches \
            -H 'Accept: application/vnd.github.v3+json' \
            -u "$FRONTPAGE_TOKEN" \
            --data "{\"event_type\": \"request-create-frontpage-branch\", \"client_payload\": {\"branch\": \"${BRANCH}\"}}"
